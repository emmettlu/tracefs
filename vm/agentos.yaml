# Lima VM for acfs and its kernel probes: Arch Linux ARM built by build-alarm-image.sh,
# prepared by setup-guest.sh.
# limactl create --name=agentos vm/agentos.yaml && limactl start agentos
images:
- location: ~/.cache/afsdata/arch-aarch64.qcow2
  arch: aarch64
vmType: vz
arch: aarch64
cpus: 8
memory: 16GiB
disk: 100GiB
containerd:
  system: false
  user: false
mountType: virtiofs
mounts:
- location: ~/Repos/acfs
  writable: false
- location: ~/.cache/afsdata
  writable: false
