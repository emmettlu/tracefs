name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: plugins (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: git identity for merge-file
        run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - name: btrfs-progs (Linux image tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq btrfs-progs
      - name: acfs-portable
        working-directory: sdk/portable
        run: node --test "test/*.test.js"
      - name: acfs-portable btrfs image as root (Linux)
        if: runner.os == 'Linux'
        working-directory: sdk/portable
        run: sudo env "PATH=$PATH" ACFS_LITE_TEST_DIR=/var/tmp node --test --test-name-pattern=btrfs "test/image.test.js"
      - name: dsh-acfs
        working-directory: sdk/dsh
        run: node --test "test/*.test.js"
      - name: acfs-pi install
        working-directory: sdk/pi
        run: npm install --no-audit --no-fund
      - name: acfs-pi typecheck
        working-directory: sdk/pi
        run: npx tsc -p .
      - name: acfs-pi on pi with a faux model
        working-directory: sdk/pi
        run: node test-portable.ts

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy (workspace)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: test (workspace)
        if: runner.os == 'Linux'
        run: cargo test
      - name: test (acfs-core)
        if: runner.os != 'Linux'
        run: cargo test -p acfs-core

  integration:
    name: acfsd integration (Linux, root, btrfs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -yq btrfs-progs attr util-linux python3 diffutils
      - name: build
        run: cargo build --release
      - name: host check
        run: sudo bash tests/setup-host.sh
      - name: integration tests
        run: sudo env "SRC=$PWD" "BIN=$PWD/target/release" bash tests/run.sh
      - name: results
        run: |
          cat tests/out/summary
          grep -h '^RESULT|.*|FAIL|' tests/out/*.out || true
          ! grep -Eq '^SUMMARY\|[^|]*\|(pass=[0-9]+\|fail=[1-9]|aborted|skipped)|GUARD' tests/out/summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-out
          path: tests/out
          if-no-files-found: ignore

  kernel:
    name: kernel module (Linux 7.3, QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential flex bison bc libelf-dev libssl-dev cpio qemu-system-x86 busybox-static
      - name: kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: build and run the selftests
        run: BUSYBOX=$(command -v busybox) TIMEOUT=1500 bash kernel/test.sh "$RUNNER_TEMP/k"
